[pytest]
testpaths = unit integration regression
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    unit: no debugger, no process (added automatically from the directory)
    integration: one feature on a purpose-built binary (added automatically)
    regression: legacy CTF challenge replayed end to end (added automatically)
    timeout(seconds): override the tier timeout (unit 10s, integration 10s, regression 180s)
    network: connects to a live CTF server, skipped unless --run-network
    sage: needs SageMath
    libclang: needs libclang for gdb_plus.Structure
    qemu(arch): needs qemu-user for arch and gdb-multiarch
    syscall_catchpoints: uses catch syscall (skipped under a qemu-user whose gdbstub doesn't support it)
    gef: needs GEF
    pwndbg: needs pwndbg
    libdebug: needs the legacy libdebug fork
    new_libdebug: needs libdebug >= 0.8
    remote_gdbserver: needs the arm64 machine of --remote-gdbserver=user@host and gdb-multiarch
    allow_priority_leak: don't check that the wait priority is back to 0 after the test
filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning
    ignore::ImportWarning
